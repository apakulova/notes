<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon.png">

  <title>Селф-ревью H2 2026</title>
  <style>
    :root { color-scheme: light; --page:#eef3ef; --surface:#fff; --text:#18201c; --muted:#68716b; --line:#d9e2dc; --accent:#187255; --accent-dark:#0c4f3a; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 85% 10%, rgba(40,142,102,.18), transparent 28rem),var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { position:relative; overflow:hidden; width:min(100%,480px); padding:38px; border:1px solid var(--line); border-radius:26px; background:rgba(255,255,255,.96); box-shadow:0 24px 70px rgba(23,58,42,.13); }
    main::after { position:absolute; top:-82px; right:-72px; width:190px; height:190px; border:42px solid rgba(24,114,85,.08); border-radius:50%; content:""; pointer-events:none; }
    .mark { display:grid; place-items:center; width:52px; height:52px; margin-bottom:30px; border-radius:16px; background:#e4f3ec; color:var(--accent); font-size:25px; }
    .eyebrow { margin:0 0 9px; color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    h1 { margin:0 0 12px; font-size:34px; line-height:1.08; letter-spacing:-.035em; }
    p { margin:0 0 26px; color:var(--muted); font-size:16px; line-height:1.5; }
    label { display:block; margin:0 0 8px; font-size:14px; font-weight:650; }
    .password-wrap { position:relative; }
    input { width:100%; height:50px; padding:0 92px 0 14px; border:1px solid #becbc3; border-radius:12px; background:#fff; color:var(--text); font:inherit; outline:none; }
    input.masked { -webkit-text-security:disc; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(24,114,85,.14); }
    button { border:0; font:inherit; font-weight:700; cursor:pointer; }
    .reveal { position:absolute; top:5px; right:5px; width:auto; height:40px; padding:0 11px; border-radius:9px; background:#eff4f1; color:#486056; font-size:13px; }
    .submit { width:100%; height:50px; margin-top:12px; border-radius:12px; background:var(--accent); color:#fff; }
    button:hover { background:var(--accent-dark); color:#fff; }
    button:disabled { opacity:.65; cursor:wait; }
    #error { min-height:22px; margin:12px 0 0; color:var(--danger); font-size:14px; }
    .hint { margin:9px 0 0; color:#758079; font-size:13px; }
    .note { margin:20px 0 0; padding-top:18px; border-top:1px solid #e8ece9; color:#858d88; font-size:13px; }
    code { padding:2px 5px; border-radius:5px; background:#edf2ef; color:#40544a; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media (max-width:520px) { body { padding:14px; } main { padding:30px 22px; border-radius:22px; } h1 { font-size:31px; } }
  </style>
</head>

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    function normalizePassword(value) {
      const normalized = value.normalize("NFC").trim();
      const lowered = normalized.toLocaleLowerCase("ru-RU");
      const withCyrillicLookalikes = lowered
        .replaceAll("p", "р")
        .replaceAll("e", "е")
        .replaceAll("b", "в");
      if (withCyrillicLookalikes === "ревью" || lowered === "htdm." || lowered === "htd.m") {
        return "Ревью";
      }
      return normalized;
    }

    async function unlock(password) {
      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", encoder.encode(password.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(payload.salt), iterations: 210000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(payload.iv) },
        key,
        fromBase64(payload.data)
      );
      return new TextDecoder().decode(decrypted);
    }

    document.getElementById("unlock").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      const password = normalizePassword(document.getElementById("password").value);
      button.disabled = true;
      button.textContent = "Открываю…";
      error.textContent = "";

      try {
        const html = await unlock(password);
        document.open();
        document.write(html);
        document.close();
      } catch {
        error.textContent = "Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.";
        button.disabled = false;
        button.textContent = "Открыть страницу";
        document.getElementById("password").select();
      }
    });

    document.getElementById("reveal").addEventListener("click", () => {
      const input = document.getElementById("password");
      const button = document.getElementById("reveal");
      const shouldShow = input.classList.contains("masked");
      input.classList.toggle("masked", !shouldShow);
      button.textContent = shouldShow ? "Скрыть" : "Показать";
      button.setAttribute("aria-pressed", String(shouldShow));
      input.focus();
    });
  </script>
